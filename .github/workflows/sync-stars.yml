name: Sync GitHub Stars

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Diff starred repos against organized lists
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_stars.py

      - name: Commit new unsorted stars
        if: steps.sync.outputs.new_count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Linux/Ricing/Unsorted-New-Stars.md
          git commit -m "Add ${{ steps.sync.outputs.new_count }} newly starred repo(s) for triage"
          git push
